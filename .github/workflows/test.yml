# RT-DLM Testing Workflow
# Runs pytest on push/PR to any branch

name: Tests

on:
  push:
    branches: ['**']  # Run on any branch
  pull_request:
    branches: ['**']  # Run on PR to any branch

env:
  PYTHONUNBUFFERED: "1"
  JAX_PLATFORM_NAME: cpu  # Use CPU for CI testing

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Free disk space on runner
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After cleanup:" && df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pin JAX/jaxlib to match requirements.txt -- dm_haiku 0.0.13 breaks on JAX>=0.6
          # (jax.core.JaxprEqn was removed; haiku still imports it).
          pip install --no-cache-dir "jax[cpu]==0.4.35" "jaxlib==0.4.35"
          # Slim CI deps: omits tensorflow, torch, qiskit-aer, ray, gradio, moviepy, wandb,
          # fastapi, sphinx (~8 GB) -- none are imported in src/.
          pip install --no-cache-dir -r requirements-ci.txt
          # Show disk after install
          df -h /
          pip cache purge || true

      - name: Run tests with coverage
        run: |
          pytest src/tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -x \
            --timeout=300 \
            -n auto
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && success()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-rt-dlm
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12' && success()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # Quick smoke test for model initialization
  smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir "jax[cpu]==0.4.35" "jaxlib==0.4.35"
          pip install --no-cache-dir -r requirements-ci.txt

      - name: Run model smoke test
        run: |
          python -c "
          import jax
          from src.rtdlm import create_rtdlm_agi
          from src.config.agi_config import AGIConfig
          
          config = AGIConfig.from_preset('tiny')
          print(f'Model config: {config}')
          print(f'JAX devices: {jax.devices()}')
          print(' Model initialization smoke test passed!')
          "
        env:
          JAX_PLATFORM_NAME: cpu
