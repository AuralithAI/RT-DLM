{{- if .Values.runtimeClass.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name | default "nvidia" }}
  labels:
    {{- include "rtdlm.training.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler | default "nvidia" }}
{{- if .Values.runtimeClass.scheduling }}
scheduling:
  {{- toYaml .Values.runtimeClass.scheduling | nindent 2 }}
{{- end }}
{{- end }}
