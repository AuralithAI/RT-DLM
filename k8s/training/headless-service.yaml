apiVersion: v1
kind: Service
metadata:
  name: rtdlm-workers
  namespace: rtdlm
  labels:
    app.kubernetes.io/name: rtdlm
    app.kubernetes.io/component: distributed-trainer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: distributed-trainer
  ports:
    - name: nccl
      port: 29500
    - name: metrics
      port: 8000
