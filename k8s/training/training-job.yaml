apiVersion: batch/v1
kind: Job
metadata:
  name: rtdlm-training
  namespace: rtdlm
  labels:
    app.kubernetes.io/name: rtdlm
    app.kubernetes.io/component: trainer
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtdlm
        app.kubernetes.io/component: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      restartPolicy: Never
      serviceAccountName: rtdlm-training-sa
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      priorityClassName: rtdlm-high-priority
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.present: "true"
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: training
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-H100-80GB-HBM3
                      - NVIDIA-H200
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: trainer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: trainer
          image: ghcr.io/auralithai/rt-dlm:train-latest
          imagePullPolicy: Always
          command: ["python", "src/train.py"]
          args:
            - "--preset=$(MODEL_PRESET)"
            - "--checkpoint_dir=/checkpoints"
          envFrom:
            - configMapRef:
                name: rtdlm-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              ephemeral-storage: "50Gi"
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: "64Gi"
              ephemeral-storage: "100Gi"
              nvidia.com/gpu: "4"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
            - name: logs
              mountPath: /logs
            - name: data
              mountPath: /data
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          ports:
            - name: metrics
              containerPort: 8000
            - name: nccl
              containerPort: 29500
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: rtdlm-checkpoints
        - name: logs
          persistentVolumeClaim:
            claimName: rtdlm-logs
        - name: data
          persistentVolumeClaim:
            claimName: rtdlm-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
