apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtdlm-training-sa
  namespace: rtdlm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rtdlm-training-role
  namespace: rtdlm
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rtdlm-training-rolebinding
  namespace: rtdlm
subjects:
  - kind: ServiceAccount
    name: rtdlm-training-sa
    namespace: rtdlm
roleRef:
  kind: Role
  name: rtdlm-training-role
  apiGroup: rbac.authorization.k8s.io
