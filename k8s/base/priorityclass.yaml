apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: rtdlm-high-priority
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Priority class for RT-DLM GPU training workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: rtdlm-eval-priority
value: 100000
globalDefault: false
preemptionPolicy: Never
description: "Lower-priority class for non-preempting evaluation jobs."
